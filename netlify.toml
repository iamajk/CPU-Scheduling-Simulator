# ──────────────────────────────────────────────
#  Netlify configuration
#  The live demo is the fully client-side frontend in /client.
#  All 6 scheduling algorithms, Gantt chart, statistics,
#  comparison and export run in the browser — no backend needed.
# ──────────────────────────────────────────────
[build]
  publish = "client"
  command = ""

[build.environment]
  NODE_VERSION = "18"

# Long-cache the static assets, always revalidate the HTML
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
